pattern_set:
  kind: pattern
  title: GENKI 201 Verbs (verb conjugation chart)
  reviewed: false
  patterns:
  - template: Short present affirmative (plain form) → 102 Long present affirmative (Masu-form)
    gloss: Polite non-past affirmative form of the verb.
    examples:
    - くすりをのむ → くすりをのみます
    - おぼえる → おぼえます
    - うんどうする → うんどうします
    where: page 1, columns ひらがな → 102 Masu-form
  - template: Short present affirmative (plain form) → 103 te-form
    gloss: 'Te-form, formed by verb type: u-verbs change the final syllable, ru-verbs drop る + て, する-verbs use して.'
    examples:
    - くすりをのむ → くすりをのんで
    - ひく → ひいて
    - おぼえる → おぼえて
    - さんぽする → さんぽして
    where: page 1, columns ひらがな → 103 te-form
  - template: Short present affirmative (plain form) → 103 Short present negative (nai-form)
    gloss: Plain non-past negative.
    examples:
    - くすりをのむ → くすりをのまない
    - でる → でない
    - うんどうする → うんどうしない
    where: page 1, columns ひらがな → 103 nai-form
  - template: Short present affirmative (plain form) → 104 Short past affirmative (ta-form)
    gloss: Plain past affirmative, patterning with the te-form.
    examples:
    - ひく → ひいた
    - くすりをのむ → くすりをのんだ
    - おぼえる → おぼえた
    - さんぽする → さんぽした
    where: page 1, columns ひらがな → 104 ta-form
  - template: Short present negative (nai-form) → 104 Short past negative (Nakatta-form)
    gloss: 'Plain past negative: 〜ない becomes 〜なかった.'
    examples:
    - とまらない → とまらなかった
    - でない → でなかった
    - うんどうしない → うんどうしなかった
    where: page 1, columns 103 nai-form → 104 Nakatta-form
  - template: Short present affirmative (plain form) → 201 Potential form (Basic)
    gloss: 'Potential "can do": u-verbs take -eru, ru-verbs take られる, する becomes できる.'
    examples:
    - くすりをのむ → くすりをのめる
    - ひく → ひける
    - とまる → とまれる
    - おぼえる → おぼえられる
    - でる → でられる
    - うんどうする → うんどうできる
    where: page 1, columns ひらがな → 201 Potential form Basic
  - template: 201 Potential form (Basic) → masu-form / te-form / nai-form / ta-form / nakatta-form
    gloss: The potential form itself conjugates as a ru-verb across the same five form columns.
    examples:
    - ひける → ひけます
    - ひける → ひけて
    - ひける → ひけない
    - ひける → ひけた
    - ひける → ひけなかった
    where: page 1, 201 Potential form column group
  - template: Short present affirmative (plain form) → 201 Volitional form
    gloss: 'Volitional "let''s / I''ll": u-verbs take -ou, ru-verbs take よう, する becomes しよう.'
    examples:
    - とまる → とまろう
    - ひく → ひこう
    - おぼえる → おぼえよう
    - でる → でよう
    - さんぽする → さんぽしよう
    where: page 1, columns ひらがな → 201 Volitional form

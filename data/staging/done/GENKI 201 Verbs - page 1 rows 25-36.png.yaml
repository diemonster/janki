  patterns:
  - template: Short present affirmative → Long present affirmative (Masu-form)
    gloss: Polite non-past form of a verb, listed for GENKI chapter 102.
    examples:
    - あそぶ → あそびます
    - でかける → でかけます
    - たつ → たちます
    where: page 1, column group '102 · Long present affirmative · Masu-form'
  - template: Short present affirmative → te-form
    gloss: The connective te-form, listed for GENKI chapter 103.
    examples:
    - あそぶ → あそんで
    - いそぐ → いそいで
    - でかける → でかけて
    where: page 1, column '103 · te-form'
  - template: Short present affirmative → Short present negative (nai-form)
    gloss: Plain negative non-past form, listed for GENKI chapter 103.
    examples:
    - つかう → つかわない
    - けす → けさない
    - でかける → でかけない
    where: page 1, column '103 · Short present negative · nai-form'
  - template: Short present affirmative → Short past affirmative (ta-form)
    gloss: Plain past form, listed for GENKI chapter 104.
    examples:
    - あそぶ → あそんだ
    - すわる → すわった
    - でかける → でかけた
    where: page 1, column '104 · Short past affirmative · ta-form'
  - template: Short present affirmative → Short past negative (Nakatta-form)
    gloss: Plain past negative form, listed for GENKI chapter 104.
    examples:
    - やる → やらなかった
    - てつだう → てつだわなかった
    - でかける → でかけなかった
    where: page 1, column '104 · Short past negative · Nakatta-form'
  - template: Short present affirmative → Potential form (Basic)
    gloss: Plain potential form, 'can do', taught in GENKI 201; u-verbs and ru-verbs are listed side by side.
    examples:
    - あそぶ → あそべる
    - つかう → つかえる
    - でかける → でかけられる
    where: page 1, column '201 Potential form · Short present affirmative · Basic'
  - template: Short present affirmative → Volitional form
    gloss: Plain volitional, 'let's / I'll do', listed in the GENKI 201 block.
    examples:
    - あそぶ → あそぼう
    - はいる → はいろう
    - でかける → でかけよう
    where: page 1, column '201 Potential form · Volitional form'

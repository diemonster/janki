    - そうじする → そうじして
    where: page 1, 漢字/ひらがな columns → column 103 te-form, rows 74, 75, 78
  - template: short present affirmative (dictionary form) → nai-form
    gloss: 'Short present negative: ru-verbs drop る and add ない, u-verbs shift to the あ-row + ない, する-verbs become しない.'
    examples:
    - すてない
    - もっていかない
    - うんてんしない

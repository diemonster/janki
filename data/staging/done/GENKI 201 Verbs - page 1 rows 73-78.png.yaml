  - template: short present affirmative (dictionary form) → ta-form
    gloss: 'Short past affirmative: the te-form''s て/で is replaced by た/だ.'
    examples:
    - すてる → すてた
    - もっていく → もっていった
    - せんたくする → せんたくした
    where: page 1, 漢字/ひらがな columns → column 104 Short past affirmative ta-form, rows 73, 74, 77
  - template: nai-form 〜ない → Nakatta-form 〜なかった
    gloss: 'Short past negative: replace ない with なかった.'
    examples:
    - すてない → すてなかった
    - もっていかない → もっていかなかった
    - せんたくしない → せんたくしなかった

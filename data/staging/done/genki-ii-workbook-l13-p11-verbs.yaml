review_notes: 'The five verbs from the Genki II workbook Lesson 13 page 11 chart ("1 Potential Verbs-1") that the collection did not already hold. The workbook prints only the dictionary forms; its te-form, potential and potential-negative columns are blank for the student, so nothing here is copied from an answer key. Readings and identity only: meanings, examples and usage notes are left for the enrichment passes. The one-line glosses below exist only to satisfy validation before promote; the --ai pass is run with --force-fields so it authors the shipped meanings itself.

  The twelve words after the verbs teach the kanji 物・特・鳥・料・理 the way the Kanji Practice 112-123 deck does: two or three words per character, covering the kun and on readings on the sheet. 料理 carries both 料 and 理, and 特に is also Lesson 13 vocabulary (textbook page 25).


  Promoted 17 record(s) from this file.'

  patterns:
  - template: 'ru-verb: 〜る → 〜られる (Potential form · Basic)'
    gloss: 'Potential form of ru-verbs: drop る and add られる.'
    examples:
    - あける → あけられる
    - しめる → しめられる
    - おしえる → おしえられる
    where: page 1, Verb type column with 201 Potential form · Basic column
  - template: 'u-verb: final -u → -eru (Potential form · Basic)'
    gloss: 'Potential form of u-verbs: change the final -u vowel to -eru.'
    examples:
    - もつ → もてる
    - やすむ → やすめる
    where: page 1, Verb type column with 201 Potential form · Basic column
  - template: 'irregular: 〜する → 〜できる (Potential form · Basic)'
    gloss: Potential form of suru-verbs is できる.
    examples:
    - でんわする → でんわできる
    where: page 1, Verb type "irregular" row with 201 Potential form · Basic column
  - template: 'irregular: 〜くる → 〜こられる (Potential form · Basic)'
    gloss: Potential form of kuru-verbs is こられる.
    examples:
    - つれてくる → つれてこられる
    where: page 1, Verb type "irregular" row with 201 Potential form · Basic column
  - template: Potential Basic 〜る → 〜ます / 〜て / 〜ない / 〜た / 〜なかった
    gloss: The potential form itself conjugates like a ru-verb.
    examples:
    - もてる → もてます / もてて / もてない / もてた / もてなかった
    - あけられる → あけられます / あけられて / あけられない / あけられた / あけられなかった
    where: page 1, 201 Potential form columns
  - template: 'ru-verb: 〜る → 〜よう (Volitional form)'
    gloss: 'Volitional form of ru-verbs: drop る and add よう.'
    examples:
    - あける → あけよう
    - かりる → かりよう
    where: page 1, Verb type column with Volitional form column
  - template: 'u-verb: final -u → -ou (Volitional form)'
    gloss: 'Volitional form of u-verbs: change the final -u vowel to -ou.'
    examples:
    - もつ → もとう
    - やすむ → やすもう
    where: page 1, Verb type column with Volitional form column
  - template: 'irregular: 〜する → 〜しよう / 〜くる → 〜こよう (Volitional form)'
    gloss: Volitional form of the irregular verbs する and くる.
    examples:
    - でんわする → でんわしよう
    - つれてくる → つれてこよう
    where: page 1, Verb type "irregular" rows with Volitional form column
  - template: 'ru-verb: 〜る → 〜ます / 〜て / 〜ない / 〜た / 〜なかった'
    gloss: 'Basic form set of ru-verbs: drop る and add the ending.'
    examples:
    - あける → あけます / あけて / あけない / あけた / あけなかった
    - かりる → かります / かりて / かりない / かりた / かりなかった
    where: page 1, columns 102/103/104 with Verb type "ru" rows
  - template: 'u-verb: final -u → -imasu (Long present affirmative · Masu-form)'
    gloss: 'Masu-form of u-verbs: change the final -u vowel to -i and add ます.'
    examples:
    - もつ → もちます
    - やすむ → やすみます
    where: page 1, column 102 with Verb type "u" rows
  - template: 'u-verb: final -u → -anai (Short present negative · nai-form)'
    gloss: 'Nai-form of u-verbs: change the final -u vowel to -a and add ない.'
    examples:
    - もつ → もたない
    - やすむ → やすまない
    where: page 1, column 103 with Verb type "u" rows
  - template: u-verb 〜つ → 〜って (te-form) / 〜った (ta-form)

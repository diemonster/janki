pattern_set:
  kind: pattern
  title: Te-form Song / How to Conjugate Verbs into Te-form (NIHONGODEKITA)
  reviewed: false
  patterns:
  - template: う・つ・る ⇨ って
    gloss: Godan (Group I) verbs ending in う, つ, or る take the て-form ending って
    examples:
    - かう ⇨ って
    - まつ ⇨ って
    - とる ⇨ って
    - ex. かう ⇨ かって (う ending changes to って) (to buy)
    where: p.1 Te-form Song; p.2 U-Verb (Godan/ Group I)
  - template: む・ぶ・ぬ ⇨ んで
    gloss: Godan verbs ending in む, ぶ, or ぬ take the て-form ending んで
    examples:
    - すむ ⇨ んで
    - あそぶ ⇨ んで
    - しぬ ⇨ んで
    where: p.1 Te-form Song
  - template: く ⇨ いて
    gloss: Godan verbs ending in く take the て-form ending いて
    examples:
    - かく ⇨ いて
    where: p.1 Te-form Song
  - template: ぐ ⇨ いで
    gloss: Godan verbs ending in ぐ take the て-form ending いで
    examples:
    - およぐ ⇨ いで
    where: p.1 Te-form Song
  - template: す ⇨ して
    gloss: Godan verbs ending in す take the て-form ending して
    examples:
    - はなす ⇨ して
    where: p.1 Te-form Song
  - template: 〜る ⇨ 〜て (Ichidan)
    gloss: For ru-verbs (Ichidan/Group II), simply change the final る to て
    examples:
    - ex. たべる ⇨ たべて (to eat)
    - おきる ⇨ おきて (to wake up)
    where: p.2 Ru-Verb (Ichidan/ Group II)
  - template: いく ⇨ いって
    gloss: 'いく is an exception: although it ends in く, its て-form is いって, not いいて'
    examples:
    - いく ⇨ いって
    - いく is an exception and the te-form becomes いって
    where: p.1 Te-form Song; p.2 Exception
  - template: くる ⇨ きて / する ⇨ して
    gloss: The two irregular verbs (Group III), and compounds ending in them, form きて and して
    examples:
    - くる ⇨ きて (to come)
    - する ⇨ して (to do)
    where: p.1 Te-form Song; p.2 Irregular Verbs (Group III)

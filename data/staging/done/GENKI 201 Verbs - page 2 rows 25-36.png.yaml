pattern_set:
  kind: pattern
  title: GENKI 201 Verbs — verb conjugation chart (page 2, rows 25–36)
  reviewed: false
  patterns:
  - template: Short present affirmative → Long present affirmative (Masu-form)
    gloss: Plain dictionary form becomes the polite ~ます form (u-verb final -u → -imasu, ru-verb -る → -ます, する → します).
    examples:
    - のぼる → のぼります
    - きめる → きめます
    - れんしゅうする → れんしゅうします
    where: page 1, 漢字/ひらがな columns aligned with the 102 Masu-form column
  - template: Short present affirmative → te-form
    gloss: Dictionary form becomes the て-form (う/つ/る → って, く → いて, ru-verb -る → -て, する → して).
    examples:
    - のぼる → のぼって
    - きめる → きめて
    - ごろごろする → ごろごろして
    where: page 1, ひらがな column aligned with the 103 te-form column
  - template: Short present affirmative → Short present negative (nai-form)
    gloss: Dictionary form becomes the plain negative ~ない (u-verb -u → -anai, ru-verb -る → -ない, する → しない).
    examples:
    - のぼる → のぼらない
    - きめる → きめない
    - ごろごろする → ごろごろしない
    where: page 1, ひらがな column aligned with the 103 nai-form column
  - template: Short present affirmative → Short past affirmative (ta-form)
    gloss: Dictionary form becomes the plain past ~た, formed like the て-form with た.
    examples:
    - のぼる → のぼった
    - きめる → きめた
    - ごろごろする → ごろごろした
    where: page 1, ひらがな column aligned with the 104 ta-form column
  - template: Short present affirmative → Short past negative (Nakatta-form)
    gloss: Dictionary form becomes the plain past negative ~なかった (nai-form with ない → なかった).
    examples:
    - のぼる → のぼらなかった
    - きめる → きめなかった
    - ごろごろする → ごろごろしなかった
    where: page 1, ひらがな column aligned with the 104 Nakatta-form column
  - template: Short present affirmative → Potential form (Basic)
    gloss: 'Potential: u-verb final -u → -eru, ru-verb -る → -られる, する → できる.'
    examples:
    - のぼる → のぼれる
    - きめる → きめられる
    - れんしゅうする → れんしゅうできる
    where: page 1, ひらがな column aligned with the 201 Potential form Basic column
  - template: Potential form (Basic) → Potential form Long present affirmative (masu-form)
    gloss: 'The potential form conjugates as a ru-verb: -る → -ます.'
    examples:
    - のぼれる → のぼれます
    - きめられる → きめられます
    where: page 1, 201 Potential form Basic and masu-form columns
  - template: Potential form (Basic) → Potential form te-form
    gloss: Potential -る → -て.
    examples:
    - のぼれる → のぼれて
    - きめられる → きめられて
    where: page 1, 201 Potential form Basic and te-form columns
  - template: Potential form (Basic) → Potential form Short present negative (nai-form)
    gloss: Potential -る → -ない.
    examples:
    - のぼれる → のぼれない
    - きめられる → きめられない
    where: page 1, 201 Potential form Basic and nai-form columns
  - template: Potential form (Basic) → Potential form Short past affirmative (ta-form)
    gloss: Potential -る → -た.
    examples:
    - のぼれる → のぼれた
    - きめられる → きめられた
    where: page 1, 201 Potential form Basic and ta-form columns
  - template: Potential form (Basic) → Potential form Short past negative (nakatta-form)
    gloss: Potential -る → -なかった.
    examples:
    - のぼれる → のぼれなかった
    - きめられる → きめられなかった
    where: page 1, 201 Potential form Basic and nakatta-form columns
  - template: Short present affirmative → Volitional form
    gloss: 'Volitional: u-verb final -u → -ou, ru-verb -る → -よう, する → しよう.'
    examples:
    - のぼる → のぼろう
    - きめる → きめよう
    - ごろごろする → ごろごろしよう
    where: page 1, ひらがな column aligned with the Volitional form column

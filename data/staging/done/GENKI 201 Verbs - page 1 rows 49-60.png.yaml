    - はたらく → はたらきます
    - うたう → うたいます
    where: page 1, column group 102 “Long present affirmative / Masu-form”
  - template: u-verb short present affirmative → te-form
    gloss: The te-form used for requests, linking, and 〜ている.
    examples:
    - わたる → わたって
    - はたらく → はたらいて
    - すむ → すんで
    where: page 1, column group 103 “te-form”
  - template: 'u-verb short present affirmative → Short present negative (nai-form): final -u → -a + ない'
    gloss: Plain negative non-past; う-ending verbs insert わ.
    examples:
    - わたる → わたらない
    - はたらく → はたらかない
    - うたう → うたわない
    where: page 1, column group 103 “Short present negative / nai-form”
  - template: u-verb short present affirmative → Short past affirmative (ta-form)
    gloss: Plain past, formed like the te-form with た/だ.
    examples:
    - わたる → わたった
    - はく → はいた
    - すむ → すんだ
    where: page 1, column group 104 “Short past affirmative / ta-form”
  - template: 'u-verb short present affirmative → Short past negative (Nakatta-form): nai-form ない → なかった'
    gloss: Plain past negative.
    examples:
    - しる → しらなかった
    - はたらく → はたらかなかった
    - うたう → うたわなかった
    where: page 1, column group 104 “Short past negative / Nakatta-form”
  - template: 'u-verb short present affirmative → Potential form (Basic): final -u → -eru'
    gloss: Plain potential, 'can do'; the irregular もってくる takes もってこられる.
    examples:
    - わたる → わたれる
    - はたらく → はたらける
    - もってくる → もってこられる
    where: page 1, column group 201 Potential form “Short present affirmative / Basic”
  - template: Potential Basic (-eru) → -emasu / -ete / -enai / -eta / -enakatta
    gloss: The potential form itself conjugates like a ru-verb across the polite, te, negative, past, and past-negative columns.
    examples:

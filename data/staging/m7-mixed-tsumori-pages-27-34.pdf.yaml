pattern_set:
  kind: pattern
  title: 'Pair Work: ~つもりです。/ Occasion に'
  reviewed: false
  patterns:
  - template: Verb (dictionary form) + つもりです
    gloss: I plan / intend to do ~
    examples:
    - 月曜日はせんたくするつもりです。
    - ほんをよむつもりです。
    - たくさんしゃしんをとるつもりです。
    - しんかんせんで行くつもりです。
    - はい、うんどうするつもりです。
    where: pp.1, 3, 5
  - template: Verb (ない form) + つもりです
    gloss: I plan / intend not to do ~
    examples:
    - しごとにいかないつもりです
    - あそびにいかないつもりです。
    - 何も食べないつもりです。
    - あさはやくおきないつもりです。
    - いいえ、今週はしないつもりです。
    where: pp.1, 5
  - template: Verb (dictionary form) + つもりだ(よ)
    gloss: 'casual form of ~つもりです: I''m planning to ~'
    examples:
    - 日本語の勉強するつもりだよ!
    where: p.6
  - template: Occasion + に + (event/action)
    gloss: on / at a holiday or special day, marking it as a point in time
    examples:
    - 今年のクリスマスに何をしますか？
    - クリスマスにプレゼントをもらいました。
    - バレンタインデーに チョコレートをあげます。
    - お正月にハワイでごろごろしたいんです。
    - ❌ はなびたいかいにアイスクリームを食べました。
    where: pp.7-8
  - template: '[Transportation]で行く／いく'
    gloss: to go by (means of transport)
    examples:
    - しんかんせんで行くつもりです。
    - バスでいくつもりです。
    - ひこうきでいくつもりです。
    where: pp.3-4
  - template: どうやって + place + に行きますか
    gloss: How will you get to (place)?
    examples:
    - どうやってきょうとに行きますか？
    where: p.3

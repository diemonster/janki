pattern_set:
  kind: pattern
  title: 'Pair Work: ~つもりです。/ Occasion に'
  reviewed: false
  patterns:
  - template: '[verb dictionary form] + つもりです'
    gloss: I plan/intend to do ~ (stating a plan politely)
    examples:
    - 月曜日はせんたくするつもりです。
    - ほんをよむつもりです。
    - 友達と晩ご飯を食べるつもりです。
    - たくさんしゃしんをとるつもりです。
    - しんかんせんで行くつもりです。
    - はい、うんどうするつもりです。
    where: pages 1, 3, 4, 5
  - template: '[verb ない-form] + つもりです'
    gloss: I plan/intend not to do ~ (negative intention)
    examples:
    - しごとにいかないつもりです
    - あそびにいかないつもりです。
    - 何も食べないつもりです。
    - あさはやくおきないつもりです。
    - いいえ、今週はしないつもりです。
    where: pages 1, 5
  - template: '[verb dictionary form] + つもりだ(よ)'
    gloss: Casual, plain-form version of 〜つもりです, used with friends
    examples:
    - 日本語の勉強するつもりだよ!
    where: page 6
  - template: '[holiday / special day] に + [action]'
    gloss: に marks a holiday or special day as a point in time ('on Christmas', 'on Valentine's Day')
    examples:
    - 今年のクリスマスに何をしますか？
    - クリスマスにプレゼントをもらいました。
    - バレンタインデーに チョコレートをあげます。
    - お正月にハワイでごろごろしたいんです。
    where: pages 7, 8
  - template: '[event treated as a place, e.g. はなびたいかい] で + [action]'
    gloss: Use で, not the occasion に, when the noun is an event/place where something happens; the slide
      states that はなびたいかい counts as such an event/place, unlike a holiday used as a point in time
    examples: []
    where: page 8

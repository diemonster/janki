pattern_set:
  kind: pattern
  title: 'Pair Work: 〜つもりです。/ Occasion に'
  reviewed: false
  patterns:
  - template: Verb (plain dictionary form) + つもりです
    gloss: I plan to / I intend to do something
    examples:
    - 'A: 月曜日はせんたくするつもりです。'
    - ほんをよむつもりです。
    - 友達と晩ご飯を食べるつもりです。
    - たくさんしゃしんをとるつもりです。
    - しんかんせんで行くつもりです。
    where: pages 1, 3, 4
  - template: Verb (plain negative 〜ない) + つもりです
    gloss: I plan not to / I don't intend to do something
    examples:
    - しごとにいかないつもりです
    - あそびにいかないつもりです。
    - 何も食べないつもりです。
    - いいえ、今週はしないつもりです。
    where: pages 1, 5
  - template: Verb (plain form) + つもりだ(よ)
    gloss: 'casual form of 〜つもりです: I''m planning to ...'
    examples:
    - 'B: 日本語の勉強するつもりだよ!'
    where: page 6
  - template: Occasion/holiday + に + (event)
    gloss: 'に marks a holiday or special day as a point in time: on/at that occasion'
    examples:
    - クリスマスにプレゼントをもらいました。
    - バレンタインデーに チョコレートをあげます。
    - 今年のクリスマスに何をしますか？
    - お正月にハワイでごろごろしたいんです。
    where: pages 7, 8
  - template: ✗ Event (はなびたいかい) + に + (action) → use で instead
    gloss: An occasion understood as an event/place where something happens takes で, not に
    examples:
    - ✗ はなびたいかいにアイスクリームを食べました。(I ate ice cream at the fireworks festival.)
    where: page 8
  - template: どうやって + place + に行きますか？
    gloss: How (by what means) will you get to ~?
    examples:
    - 'A: どうやってきょうとに行きますか？'
    where: page 3

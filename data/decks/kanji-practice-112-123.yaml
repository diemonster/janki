deck:
  name: "Brandon Japanese::Kanji Practice 112–123"
  deck_id: 2059400122
  description: "Kunyomi and onyomi examples for kanji 112–123 from the practice sheets."
  output: "kanji-practice-112-123.apkg"
  cards:
    recognition: true
    production: true
    reading: false
  source: ../normalized/vocabulary.json
  # One deck per handout: each sheet is a unit of study, and its records were
  # tagged with the source slug at import. every word deck selects on a tag of its own, and
  # `m7-mixed-tsumori.yaml` carries an `exclude_ids` for the one record two of
  # them tag, so no two claim the same record — same source file, same GUIDs,
  # and an overlap moves notes between decks on every import.
  # `tests/test_anki_builder_contract.py` asserts that, over the nine word
  # decks it names. The one conjugation deck, `teform-drill.yaml`, is not among
  # them and does re-use these records; its notes are GUID-namespaced
  # (`drill:<form>:<id>`) under a different model, so they are separate notes
  # rather than the same note in two decks.
  include_tags: [kanji-practice-sheet-no-112-123]

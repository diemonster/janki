deck:
  name: "Brandon Japanese::104 Week 8 Writing Homework"
  deck_id: 2059400120
  description: "Clothing verbs and question words from the Week 8 writing homework."
  output: "104-week-8.apkg"
  cards:
    recognition: true
    production: true
    reading: false
  source: ../normalized/vocabulary.json
  # One deck per handout: each sheet is a unit of study, and its records were
  # tagged with the source slug at import. every word deck selects on a tag of its own, so no two
  # claim the same record — same source file, same GUIDs, and an overlap moves
  # notes between decks on every import. `tests/test_anki_builder_contract.py`
  # asserts that, for the nine decks it names. The two conjugation decks are
  # not in it and do re-use these records; their notes are GUID-namespaced
  # (`drill:<form>:<id>`) under their own model, so they are different notes
  # rather than the same note in two places.
  include_tags: [104-week-8-writing-homework]

deck:
  name: "Janki Study Decks::104 Week 8 Writing Homework"
  deck_id: 2059400120
  description: "Clothing verbs and question words from the Week 8 writing homework."
  output: "104-week-8.apkg"
  cards:
    recognition: true
    production: true
    reading: false
  source: ../normalized/vocabulary.json
  # `intake_tag` names this durable study destination for assignment. It reuses
  # the existing selector tag, so adding it changes no current membership.
  # Ordinary include/exclude selectors remain the build authority, and
  # `tests/test_anki_builder_contract.py` asserts the partition over all
  # word decks. Conjugation cards use namespaced GUIDs under another model and
  # are not part of that word-deck partition.
  intake_tag: 104-week-8-writing-homework
  include_tags: [104-week-8-writing-homework]

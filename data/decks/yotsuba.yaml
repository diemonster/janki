deck:
  name: "Janki Study Decks::Yotsubato Vol. 1"
  deck_id: 2059400115
  description: "The Yotsubato volume 1 reading pack, enriched: readings, pitch, sentences and audio."
  output: "yotsuba.apkg"
  cards:
    recognition: true
    production: true
    reading: false
  source: ../normalized/vocabulary.json

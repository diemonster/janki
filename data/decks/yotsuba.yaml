deck:
  name: "Brandon Japanese::Yotsubato Vol. 1"
  deck_id: 2059400115
  description: "The Yotsubato volume 1 reading pack, enriched: readings, pitch, sentences and audio."
  output: "yotsuba.apkg"
  cards:
    recognition: true
    production: true
    reading: false
  source: ../normalized/vocabulary.json
  # The tag `import-anki` puts on everything it reads. Every word deck selects
  # on a tag of its own, and `m7-mixed-tsumori.yaml` carries an `exclude_ids`
  # for the one record two of them tag, so no two claim the same record — same
  # source file, same GUIDs, and an overlap means each import moves notes
  # between decks. `tests/test_anki_builder_contract.py` asserts that over the
  # nine word decks it names. The one conjugation deck, `teform-drill.yaml`, is
  # not among them and does re-use these records; its notes are GUID-namespaced
  # (`drill:<form>:<id>`) under a different model, so they are separate notes
  # rather than the same note in two decks.
  include_tags: [anki]

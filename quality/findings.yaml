  - id: input-parent-inbox-provenance
    state: fixed
    pipeline_stage: input-provenance
    source_archetypes: [camera, printed-ruby, bilingual-layout]
    symptom: A source already stored in the durable inbox root was copied again into the configured scan subdirectory before extraction.
    invariant: A regular source anywhere under the durable inbox root is used where it lies unless another durable source has the same case-insensitive basename and different bytes; that collision is refused before model or staging work and an external copy cannot bypass it.

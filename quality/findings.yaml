    case_ids: [reading-check-suru-compound]
    fix_ref: src/japanese_anki/enrich.py#dictionary_readings
  - id: review-pitch-fact-recheck
    state: fixed
    pipeline_stage: final-review
    source_archetypes: [mixed-layout-pdf]
    symptom: Final review raised blocking pitch findings after it misread the stored raw pattern, counted a small kana as a separate mora, or replaced valid dictionary accent from model memory.
    invariant: A pitch finding gets one independent recheck with the exact raw pattern and deterministic mora-level rendering; model memory yields only when a source marker fingerprints the current jpdb value.
    evidence:
      - fingerprint: 0b2af7e5a8f9cff39462ba2dfbaa393188b892b3836989b2867f5ccd5ffbe17a
        locator: quality/cases/review-pitch-fact-recheck/input.json

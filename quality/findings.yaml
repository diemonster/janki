version: 1
findings:
  - id: anki-deck-membership-overlap
    state: fixed
    pipeline_stage: deck-membership
    source_archetypes: [camera, mixed-layout-pdf, native-pdf-table]
    symptom: The unfiltered general verbs deck also claimed records assigned to dedicated hardening-pilot decks, so packages exported the same stable Anki GUIDs under different deck IDs.
    invariant: Every discovered vocabulary deck is nonempty and enters an automatic all-pairs stable-ID check; no record belongs to more than one word deck unless an explicit reviewed migration plan says otherwise.
    evidence:
      - fingerprint: ca3d163bab055381827226140568f3bef7eaac187cebd76878e0b63e9e442356
        locator: quality/cases/deck-membership-partition/input.json
    recurrences: []
    case_ids: [deck-membership-partition]
    fix_ref: data/decks/verbs.yaml
  - id: ai-existing-example-annotations
    state: fixed
    pipeline_stage: ai-enrichment
    source_archetypes: [mixed-layout-pdf]
    symptom: AI enrichment kept reviewed source sentences but could not fill their empty English, furigana, or register fields.
    invariant: AI can fill empty annotations only when its Japanese sentence matches the reviewed stored sentence exactly; it preserves Japanese text, audio, and existing annotations.
    evidence:
      - fingerprint: 26bf29f64985ac036953289040f6ed56b29bac1609d12eaf70c7a628296ef92e
        locator: quality/cases/ai-existing-example-annotations/input.json
    recurrences: []
    case_ids: [ai-existing-example-annotations]
    fix_ref: src/japanese_anki/enrich.py#_fill_existing_example_annotations
  - id: ai-exact-headword-spelling
    state: fixed
    pipeline_stage: ai-enrichment
    source_archetypes: [native-pdf-table]
    symptom: AI enrichment replaced kana headwords with kanji spellings, so the exact-target check rejected every example.
    invariant: Each generated example uses the record expression exactly as written, including a kana-only spelling, in a natural inflected form; one limited retry supplies the permitted forms when every first-pass example fails this check.
    evidence:
      - fingerprint: 46f44e594c406bfe0ef54598caddf3f8d932829cb4ef93c09eb4d9d29e958e8e
        locator: quality/cases/ai-exact-headword-spelling/input.json
    recurrences:
      - fingerprint: 1c4b2a599b99466d19012701032f949008ca22c2b93d1b572451b5662a70c811
        locator: quality/cases/ai-rejected-example-retry/input.json
    case_ids: [ai-exact-headword-spelling, ai-rejected-example-retry]
    fix_ref: src/japanese_anki/enrich.py#ai_retry_prompt
  - id: enrichment-forced-kana-reading
    state: fixed
    pipeline_stage: dictionary-enrichment
    source_archetypes: [native-pdf-table]
    symptom: Dictionary enrichment refused kana しぬ after an unforced parse resolved it as unrelated する.
    invariant: When an unforced entry has another spelling, enrichment retries with the reviewed reading before it rejects or writes dictionary fields.
    evidence:
      - fingerprint: fbd66fd9525f40c2b6844a2f10e08dc00955562cff6248adb615212ce28d730d
        locator: quality/cases/enrichment-forced-kana-reading/input.json
    recurrences: []
    case_ids: [enrichment-forced-kana-reading]
    fix_ref: src/japanese_anki/enrich.py#enrich_records
  - id: enrichment-invalid-pitch-length
    state: fixed
    pipeline_stage: dictionary-enrichment
    source_archetypes: [mixed-layout-pdf]
    symptom: Dictionary enrichment stored jpdb pitch patterns that did not fit the record reading, so word audio could not use them safely.
    invariant: Enrichment writes a pitch pattern only when the shared pitch parser proves that it fits the stored reading.
    evidence:
      - fingerprint: aa4091ede856c7421e841029877091db145e48b94e47043125dc415fcf48410a
        locator: quality/cases/enrichment-invalid-pitch-length/input.json
    recurrences: []
    case_ids: [enrichment-invalid-pitch-length]
    fix_ref: src/japanese_anki/enrich.py#_compatible_pitch_patterns
  - id: enrichment-suru-compound
    state: fixed
    pipeline_stage: dictionary-enrichment
    source_archetypes: [mixed-layout-pdf]
    symptom: Dictionary enrichment rejected valid する compounds after jpdb resolved the exact suru-verb stem.
    invariant: Enrichment uses an exact X stem only when spelling, reading, する suffix, and jpdb's suru-verb marker all agree.
    evidence:
      - fingerprint: 1269a5308b0f263eb806215cd2e1c4ebd91391dd9a410de5c86c72d6bb2ba6da
        locator: quality/cases/enrichment-suru-compound/input.json
    recurrences: []
    case_ids: [enrichment-suru-compound]
    fix_ref: src/japanese_anki/enrich.py#enrich_records
  - id: reading-check-forced-furigana
    state: fixed
    pipeline_stage: staging-promote
    source_archetypes: [native-pdf-table]
    symptom: The reading check held kana しぬ because an unforced parse resolved it as unrelated する.
    invariant: The reading check binds the reviewed reading, and a batched parse sends one furigana list for each input text.
    evidence:
      - fingerprint: d8f97240a7147a361acd69b43ba1b877759683c59bf6b7d97bd01640c6399c63

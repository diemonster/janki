  # 2026-08-14 (M7.6V): the invariant below was narrowed on the repository
  # owner's decision. The removed clause read "learner load is bounded from
  # parsed and known-vocabulary data when that data is offered"; the bound it
  # named is deleted. Measured first: it held 0 of 155 examples across 97
  # records, and did not fire on 逡巡 (jpdb rank 9100), 邂逅 (16600) or 憂鬱
  # (6900) either, because its limit was rank 20000 — a level a model writing
  # from the style guide never reaches. It worked; it was calibrated to a
  # threshold nothing meets. Its input was also wrong: reading jpdb's sentence
  # segmentation it counted とする on 今、だれとすんでるの？, absent from that
  # sentence, while 住む — the word actually inside すんでる — went uncounted.
  # The clause was never observable by this finding's case, which supplies no
  # parse and no known-vocabulary data, so the narrowing moved the invariant
  # closer to what is proved. What replaces the bound is the paid review,
  # judging difficulty as language rather than by rank.
  - id: example-teaching-suitability
    state: fixed
    pipeline_stage: validation-qc
    source_archetypes: [camera]
    symptom: Local validation checked structure only, so sentence fragments, trailing connectives, and false register labels passed every local gate and reached audio; the late paid AI review was the first check to catch them.
    invariant: Local validation holds an example that is certainly not a complete sentence or an intentional utterance, and one whose register label contradicts its sentence-final form, while accepting complete polite and casual sentences and intentional short utterances; and holds carry their level. That the audio command applies the same judgment before voicing, and that a shipping build reports local content failures before the review gate is consulted, are covered by tests rather than by this case, whose runner calls validation alone.
    evidence:

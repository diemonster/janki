  - id: ai-furigana-rewrites-sentence
    state: fixed
    pipeline_stage: ai-enrichment
    source_archetypes: [camera]
    symptom: The check that an example's furigana spells its own sentence needs no dictionary, but sat inside verify_example_furigana behind two short-circuits, so a run with no jpdb client and a card with an already-impossible reading both skipped it and were told only that the card was unverified. The rewritten particle also reaches the regenerated romaji, which a learner reads precisely because they cannot yet read the kana.
    invariant: A furigana field that spells something other than its own sentence is detected with no parse and no kanji store, and marked unverified. That it is reported by name with both strings, and that a flagged example is not voiced, are covered by tests rather than by this case, whose runner reports a warning count and never reaches the audio command.

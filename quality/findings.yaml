  - id: reading-check-suru-compound
    state: fixed
    pipeline_stage: staging-promote
    source_archetypes: [mixed-layout-pdf]
    symptom: The reading check held valid する compounds because jpdb resolved the dictionary entry for the noun stem.
    invariant: A reviewed Xする identity passes when jpdb resolves exact stem X with reading X and marks that entry as a suru verb.
    evidence:
      - fingerprint: b710ae47059e94af44066d88425d0570c548e98399658af31cb05cc1db45ca03
        locator: quality/cases/reading-check-suru-compound/input.json

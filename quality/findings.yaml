  - id: ai-impossible-character-furigana
    state: fixed
    pipeline_stage: ai-enrichment
    source_archetypes: [camera]
    symptom: AI enrichment assigned a compound's full reading to one kanji in a per-character furigana group, so the reconstructed sentence reading contained the compound twice.
    invariant: A generated per-character split accounts for common rendaku and sokuon before it is compared with stored KANJIDIC readings; a remaining disagreement is preserved and marked unverified. The rendaku and sokuon tolerance, the warning text, and the refusal to voice a flagged example are covered by tests rather than by this case — its runner reports a warning count, not warning text, and never reaches the audio command.

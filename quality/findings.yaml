  - id: enrichment-provisional-precedence
    state: fixed
    pipeline_stage: dictionary-enrichment
    source_archetypes: [camera]
    symptom: Dictionary enrichment fills only empty fields and never revisits meanings, so a provisional model-extracted meaning or part of speech outranked exact dictionary evidence and stayed canonical.

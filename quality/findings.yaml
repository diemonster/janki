        locator: quality/cases/review-pitch-unbound-remains-reviewable/input.json
    case_ids: [review-pitch-fact-recheck, review-pitch-source-authority, review-pitch-unbound-remains-reviewable]
    fix_ref: src/japanese_anki/review.py#pitch_recheck_prompt

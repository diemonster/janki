[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-anki"
version = "0.1.0"
description = "A local, version-controlled pipeline for converting Japanese study material and Shirabe Jisho exports into Anki decks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brandon" }]
dependencies = [
  "genanki>=0.13.1,<1",
  "PyYAML>=6,<7",
  # Only for rewriting a staging file a human is part-way through reviewing
  # (`staging.rewrite_staging`). PyYAML discards comments and any key outside
  # the record schema on a load/dump round trip, which for that one file means
  # deleting a reviewer's own notes; ruamel round-trips them. Everything janki
  # *writes from scratch* still goes through PyYAML.
  "ruamel.yaml>=0.18,<1",
]

[project.optional-dependencies]
# The Anthropic SDK is optional so that import, build, status and every other
# non-AI command runs on a checkout that never installed it. claude_client.py
# imports it lazily and names this extra when it is missing.
# The floor is the version claude_client.py was verified against, not a guess:
# it needs messages.parse(output_format=...) and a response carrying
# parsed_output, and a floor nobody checked would fail at the first AI call
# rather than at install time.
ai = [
  "anthropic>=0.121",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
janki = "japanese_anki.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

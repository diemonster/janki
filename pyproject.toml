[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-anki"
version = "1.0.0"
description = "A local, version-controlled pipeline for converting Japanese study material and Shirabe Jisho exports into Anki decks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brandon" }]
dependencies = [
  "genanki>=0.13.1,<1",
  "PyYAML>=6,<7",
  # Only for rewriting a staging file a human is part-way through reviewing
  # (`staging.rewrite_staging`). PyYAML discards comments and any key outside
  # the record schema on a load/dump round trip, which for that one file means
  # deleting a reviewer's own notes; ruamel round-trips them. Everything janki
  # *writes from scratch* still goes through PyYAML.
  "ruamel.yaml>=0.18,<1",
]

[project.optional-dependencies]
# AI response validation and the Anthropic SDK are optional so that import,
# build, status and every other non-AI command run without them. Codex-backed
# enrichment launches the separately installed, authenticated Codex CLI.
# The floor is the version claude_client.py was verified against, not a guess:
# it needs the top-level transform_schema export and
# messages.create(output_config={"format": ...}), and a floor nobody checked
# would fail at the first AI call rather than at install time.
ai = [
  "anthropic>=0.121",
  # Imported directly by both structured-output clients to validate a response
  # against the schema, so it is declared rather than leaned on transitively.
  "pydantic>=2",
]
# dev pulls in ai on purpose. The *runtime* promise is that non-AI commands
# work without the extra, and the lazy imports keep that true; the *test suite*
# is a different thing, and it has to exercise the AI plumbing rather than skip
# it. Without this, `./scripts/bootstrap.sh` on a fresh clone dies collecting
# tests/test_claude_client.py, and a skip-instead would report green for code
# nobody ran.
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  # One workbench journey runs through a real installed browser. Playwright is
  # the driver only: gates never download a browser or contact its CDN, and
  # the test skips when neither an installed Chrome nor a previously installed
  # Playwright Chromium is available. The module also collection-skips in a
  # non-dev checkout without this driver; bootstrap installs `[dev]`, so that
  # fallback does not hide a failed declared dependency install there.
  "playwright>=1.55,<2",
  "japanese-anki[ai]",
  # Anki itself, so `tests/test_rendered_cards.py` can ask *Anki* what the
  # templates draw instead of reading their HTML off disk. Nothing in janki
  # imports it at runtime — `collection.py` reads a collection through plain
  # sqlite precisely so a build needs no Anki install — but a furigana filter
  # that puts the reading over the wrong characters, a `{{Field}}` that no
  # longer resolves, and a `[sound:]` Anki does not recognise are all invisible
  # to a test that reads the template source, and all visible on the card.
  #
  # In `dev` rather than its own extra for the reason stated above: a suite that
  # skips this reports green for the one thing no other test can see.
  #
  # It is a *hard* requirement of the extra, and `scripts/bootstrap.sh` installs
  # `.[dev]` under `set -e`: on a platform with no anki wheel, bootstrap fails at
  # the install rather than skipping a test. The `importorskip` in
  # tests/test_rendered_cards.py covers the other case — a checkout that
  # installed the project without `[dev]` and runs pytest anyway.
  "anki>=25.2",
]

[project.scripts]
janki = "japanese_anki.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "allow_build_client: constructs a real Anthropic client on purpose",
]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[project]
name = "Brandon Japanese"

[paths]
raw_dir = "data/inbox/shirabe"
normalized_file = "data/normalized/vocabulary.json"
deck_dir = "data/decks"
template_dir = "templates/japanese-study"
dist_dir = "dist"
ledger_file = "data/ledger.json"
staging_dir = "data/staging"
media_dir = "data/media"
scan_inbox = "data/inbox/scans"

[anki]
default_deck_name = "Brandon Japanese"
default_deck_id = 2059400110
model_id_base = 1607392310

[cards]
recognition = true
production = true
reading = false

[ai]
extract_model = "claude-opus-5"
enrich_model = "claude-opus-5"

[tts]
provider = "voicevox"              # or "azure"
voicevox_url = "http://localhost:50021"
voicevox_speaker = 13               # 青山龍星 — see the README for the full list
voicevox_speed = 0.7                # 0.5–2.0; below 1 slows delivery without
                                    # dropping the pitch
azure_voice = "ja-JP-NanamiNeural"
azure_region = "westus2"

# Secrets are never read from this file. Set ANTHROPIC_API_KEY, JPDB_API_KEY,
# and AZURE_SPEECH_KEY in the environment instead.

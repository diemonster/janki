[project]
name = "Janki Study Decks"

[paths]
raw_dir = "data/inbox/shirabe"
normalized_file = "data/normalized/vocabulary.json"
deck_dir = "data/decks"
template_dir = "templates/japanese-study"
dist_dir = "dist"
ledger_file = "data/ledger.json"
staging_dir = "data/staging"
media_dir = "data/media"
assistant_dir = "data/assistant"
kanji_file = "data/kanji.json"
scan_inbox = "data/inbox/scans"

[anki]
# Which Anki profile janki checks its own notetype in. The real one: the
# scratch "janki-test" profile was for verifying the notetype upgrade against
# a collection with no review history to lose. Reading is safe either way —
# janki copies the collection to a temp directory and opens the copy, and never
# writes to yours.
profile = "User 1"
default_deck_name = "Janki Study Decks"
default_deck_id = 2059400110
model_id_base = 1607392310

[cards]
recognition = true
production = true
reading = false

[ai]
# Reading a source uses this machine's Claude Pro/Max login. Switch to
# "anthropic-api" to use ANTHROPIC_API_KEY instead; janki never falls back to
# it when the subscription transport is unavailable.
extract_provider = "claude-code"
extract_model = "claude-opus-5"
enrich_provider = "anthropic"
enrich_model = "claude-opus-5"
# Existing-card revisions use this machine's Claude Pro/Max login. Switch to
# "anthropic-api" to use ANTHROPIC_API_KEY through the same revision pipeline.
revise_provider = "claude-code"
revise_model = "claude-opus-5"
# Codex only; ignored while enrich_provider is "anthropic", whose depth comes
# from claude_client.effort_for(model) rather than from a config key.
enrich_reasoning_effort = "ultra"

[assistant]
# Opens a second, separately keyed loopback origin for ChatKit. The main
# workbench never loads third-party JavaScript or shares its session/CSRF
# secrets with the assistant origin. OpenAI hosts the ChatKit UI, while janki's
# custom backend sends each ordinary Janki message through this configured
# Claude transport as one journaled turn over bounded repository context. A
# closed typed intent may prepare an exact local action plan, but the model
# cannot execute or confirm it.
enabled = true
provider = "claude-code"          # local Claude Code Pro/Max subscription login
model = "claude-opus-5"           # pinned; unsupported model ids are refused
effort = "medium"                 # one measured turn: 8.5 s here against 10.8 s
                                  # at "xhigh". Card-writing passes are not
                                  # configurable and stay at the model's depth

[tts]
provider = "voicevox"              # words only; the one engine that forces accent
voicevox_url = "http://localhost:50021"
voicevox_speaker = 53               # 麒ヶ島宗麟 — chosen for accent audibility,
                                    # not timbre: at a 125 Hz base it keeps a lower
                                    # voice while giving heiban a 70 Hz rise. The
                                    # previous 青山龍星 (13) ranked 42nd of 43 at
                                    # 5.7 Hz, so every word sounded flat whatever
                                    # its pattern — the accent was forced correctly
                                    # and rendered inaudibly.
# voicevox_sentence_speaker = 52    # another VOICEVOX voice for sentences.
                                    # Absent means "the same voice as the
                                    # words" — 0 is a real style id, not a way
                                    # of saying nothing.

# Example sentences use the reviewed Realtime profile: gpt-realtime-1.5 at a
# slower learner pace, with cedar/ash/verse/marin selected deterministically
# from the stable record id. All examples on one note therefore keep one voice
# across rebuilds. Needs OPENAI_API_KEY in the environment — never in this file.
sentence_provider = "openai-realtime"
voicevox_speed = 0.7                # below 1 slows delivery without dropping
                                    # the pitch; janki accepts any finite >0

# Secrets are never read from this file. Codex uses the CLI's existing login;
# set ANTHROPIC_API_KEY, JPDB_API_KEY, and OPENAI_API_KEY in the environment.
